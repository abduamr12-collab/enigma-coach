<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENIGMA COACH - 450</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#080808;color:#fff}
.en{font-family:'Orbitron',sans-serif}
.topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 20px;background:#000;border-bottom:1px solid #222;z-index:99}
.hero{display:flex;justify-content:center;padding:80px 16px 30px}
.wrap{max-width:540px;width:100%}
.card{background:#111;border:1px solid #222;border-radius:22px;padding:26px;margin:18px 0}
.btn{width:100%;padding:18px;background:#fff;color:#000;border-radius:14px;font-weight:900;font-size:19px;border:none;cursor:pointer;margin-top:15px}
input,select,textarea{width:100%;padding:15px;background:#1a1a1a;border:1px solid #333;border-radius:12px;color:#fff;margin:9px 0;font-size:16px}
label{font-size:13px;color:#999;margin-top:12px;display:block}
.price-grid{display:grid;gap:16px;margin-top:16px}
.price-card{background:#161616;border:2px solid #333;border-radius:18px;padding:20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.price-card.active{border-color:#fff;background:#fff;color:#000}
.price-card span{font-size:28px;font-weight:900}
</style>
</head>
<body>
<div class="topbar"><div class="en">ENIGMA COACH</div><div style="color:#666;font-size:11px">450 EGP / MONTH</div></div>
<div class="hero"><div class="wrap">
<h1 class="en" style="font-size:44px;text-align:center">ENIGMA<br>COACH</h1>
<p style="text-align:center;color:#777;margin:10px 0 20px">اختار باقتك - 450 جنيه في الشهر</p>

<div class="card">
<h3>اختار الباقة - دوس عليها</h3>
<div class="price-grid">
<div class="price-card active" onclick="pick(this,'شهر - 450 جنيه')">
<div><b>شهر واحد</b><br><small>متابعة كاملة</small></div><div><span>450</span> جنيه</div>
</div>
<div class="price-card" onclick="pick(this,'3 شهور - 1200 جنيه')">
<div><b>3 شهور</b><br><small style="color:#0f0">وفر 150 - الأكثر طلبا</small></div><div><span>1200</span> جنيه</div>
</div>
<div class="price-card" onclick="pick(this,'6 شهور - 2200 جنيه')">
<div><b>6 شهور</b><br><small style="color:#0f0">وفر 500 جنيه</small></div><div><span>2200</span> جنيه</div>
</div>
<div class="price-card" onclick="pick(this,'12 شهر - 4000 جنيه')">
<div><b>12 شهر</b><br><small style="color:#0f0">وفر 1400 جنيه</small></div><div><span>4000</span> جنيه</div>
</div>
</div>
<p id="sel" style="text-align:center;color:#0f0;margin-top:14px;font-weight:700">✓ اخترت: شهر - 450 جنيه</p>
</div>

<div class="card">
<h3>بياناتك</h3>
<label>هدفك</label><select id="goal"><option>كثافة عضلية</option><option>تخسيس</option><option>ضخامة</option></select>
<label>التخصص</label><select id="spec"><option>كمال أجسام</option><option>تخسيس</option><option>قوة بدنية</option><option>تغذية فقط</option></select>
<label>اصابات؟</label><textarea id="injury" placeholder="لا يوجد"></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>الوزن</label><input id="w" type="number" placeholder="kg"></div><div><label>الطول</label><input id="h" type="number" placeholder="cm"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>السن</label><input id="a" type="number"></div><div><label>مكان التمرين</label><select id="pl"><option>جيم</option><option>بيت</option></select></div></div>
<label>واتسابك</label><input id="ph" placeholder="01xxxxxxxxx">
<button class="btn" onclick="send()">احجز بـ 450</button>
</div>
</div></div>

<script>
let pkg="شهر - 450 جنيه";
function pick(el,t){document.querySelectorAll('.price-card').forEach(c=>c.classList.remove('active'));el.classList.add('active');pkg=t;document.getElementById('sel').innerText="✓ اخترت: "+t;}
function send(){
 let w=document.getElementById('w').value,h=document.getElementById('h').value,ph=document.getElementById('ph').value;
 if(!w||!h||!ph){alert('كمل وزنك وطولك ورقمك');return;}
 let msg=`حجز ENIGMA%0Aالباقة: ${pkg}%0Aالهدف: ${document.getElementById('goal').value}%0Aالتخصص: ${document.getElementById('spec').value}%0Aالاصابة: ${document.getElementById('injury').value}%0Aالوزن:${w} الطول:${h} السن:${document.getElementById('a').value}%0Aمكان:${document.getElementById('pl').value}%0Aرقم
